<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>排班日统计布局</title><style>
*{box-sizing:border-box}body{margin:0;padding:32px;background:#f3f6fa;color:#26364a;font-family:"Microsoft YaHei",system-ui,sans-serif}h2{margin:0;font-size:22px}.subtitle{margin:8px 0 24px;color:#738196;font-size:14px}.canvas{background:#fff;border-radius:10px;box-shadow:0 8px 28px rgba(37,57,87,.12);overflow:hidden}.toolbar{height:66px;display:flex;align-items:center;gap:18px;padding:0 22px;border-bottom:1px solid #edf0f5}.month{width:260px;border:1px solid #dfe5ed;color:#586a80;border-radius:5px;padding:9px 12px;font-size:14px}.summary{flex:1;min-height:42px;display:flex;align-items:center;gap:7px;padding:7px 10px;background:#f5faff;border:1px solid #b8dcff;border-radius:5px;overflow-x:auto}.chip{padding:3px 8px;border-radius:10px;background:#fff;color:#4a6077;border:1px solid #dfebf7;font-size:12px;white-space:nowrap}.chip b{color:#2774be;margin-left:2px}.chip.red b{color:#e65353}.action{padding:9px 16px;border:0;border-radius:4px;color:#fff;background:#4d8ef7;font-size:13px}.grid{display:grid;grid-template-columns:100px repeat(7,1fr)}.cell{min-height:53px;padding:9px 12px;border-right:1px solid #edf0f5;border-bottom:1px solid #edf0f5;font-size:13px;color:#5d6977}.head{min-height:72px;background:#fafbfd;color:#4d5a69;font-weight:600;line-height:1.75}.selected{background:#eaf5ff;box-shadow:inset 0 2px 0 #6aaaf3}.name{color:#3d536a}.note{margin:20px 4px 0;color:#6f7e90;font-size:13px}.hot{color:#ef5656}
</style></head><body>
<h2>日班次统计：去除日期前缀</h2><p class="subtitle">统计区只显示班次与人数，所选日期仍通过浅蓝色高亮列来识别。</p>
<div class="canvas"><div class="toolbar"><div class="month">▣　2026-07　至　2026-07</div><div class="summary"><span class="chip">活动 <b>3</b></span><span class="chip">器械 <b>1</b></span><span class="chip red">8-3/夜 <b>1</b></span><span class="chip red">责1 <b>1</b></span><span class="chip">总务 <b>1</b></span></div><button class="action">打印</button><button class="action">导出 Excel</button></div>
<div class="grid"><div class="cell head">姓名</div><div class="cell head">周一<br>7月6日</div><div class="cell head">周二<br>7月7日</div><div class="cell head">周三<br>7月8日</div><div class="cell head selected">周四<br>7月9日</div><div class="cell head">周五<br>7月10日</div><div class="cell head">周六<br>7月11日</div><div class="cell head">周日<br>7月12日</div><div class="cell name">张义芝</div><div class="cell">总务</div><div class="cell">总务</div><div class="cell">活动</div><div class="cell selected">活动</div><div class="cell">活动</div><div class="cell">总务</div><div class="cell">休</div><div class="cell name">施后勤</div><div class="cell">责1</div><div class="cell"><span class="hot">责1*</span></div><div class="cell">活动</div><div class="cell selected">活动</div><div class="cell">活动</div><div class="cell">责1</div><div class="cell"><span class="hot">责1*</span></div><div class="cell name">高海霞</div><div class="cell">器械</div><div class="cell">器械</div><div class="cell">总务</div><div class="cell selected">器械</div><div class="cell">总务</div><div class="cell">休</div><div class="cell">总务</div><div class="cell name">汪崇丹</div><div class="cell">8-3/<span class="hot">夜</span></div><div class="cell"><span class="hot">中</span></div><div class="cell">休</div><div class="cell selected">8-3/<span class="hot">夜</span></div><div class="cell"><span class="hot">中</span></div><div class="cell"><span class="hot">起休</span></div><div class="cell">休</div></div></div>
<p class="note">显示“活动 3、器械 1 ……”即可，日期来自当前高亮列，不重复占据统计区空间。</p>
</body></html>
